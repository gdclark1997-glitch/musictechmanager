<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Tech Inventory & Job Manager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">🎵 MusicTech Manager</h1>
            <div class="flex items-center space-x-3">
                <span id="syncStatusBadge" class="text-xs px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">Local Mode</span>
                <button onclick="openSyncModal()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded border border-slate-700 transition">☁️ Cloud Sync</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-semibold">Asset Inventory</h2>
            <div class="space-x-2">
                <button onclick="triggerGitHubSync()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded shadow text-sm font-medium transition">🔄 Sync Now</button>
                <button onclick="openAddAssetModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded shadow text-sm font-medium transition">+ Add Asset</button>
            </div>
        </div>

        <!-- Asset Table Card -->
        <div class="bg-white rounded-lg shadow border border-slate-200 overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-100 text-slate-600 text-xs uppercase tracking-wider border-b border-slate-200">
                        <th class="p-3">Asset ID</th>
                        <th class="p-3">Make / Model</th>
                        <th class="p-3">Category</th>
                        <th class="p-3">Location</th>
                        <th class="p-3">Condition</th>
                        <th class="p-3 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="assetTableBody" class="divide-y divide-slate-200 text-sm">
                    <!-- Populated dynamically -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- GitHub Cloud Sync Modal -->
    <div id="syncModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg max-w-md w-full p-6 shadow-xl">
            <h3 class="text-lg font-bold mb-2">GitHub Cloud Sync</h3>
            <p class="text-xs text-slate-500 mb-4">Sync your database safely through GitHub API, completely bypassing corporate firewall blocks.</p>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">GitHub Username</label>
                    <input type="text" id="ghUser" placeholder="e.g. johnsmith" class="w-full p-2 border rounded text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Repository Name</label>
                    <input type="text" id="ghRepo" placeholder="e.g. musictech-manager" class="w-full p-2 border rounded text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Personal Access Token (PAT)</label>
                    <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx" class="w-full p-2 border rounded text-sm">
                </div>
            </div>

            <div class="mt-6 flex justify-end space-x-2">
                <button onclick="closeSyncModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded text-sm">Cancel</button>
                <button onclick="saveGitHubConfig()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded text-sm">Save & Connect</button>
            </div>
        </div>
    </div>

    <!-- Add Asset Modal -->
    <div id="assetModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg max-w-md w-full p-6 shadow-xl">
            <h3 class="text-lg font-bold mb-4">Add New Asset</h3>
            <div class="space-y-3">
                <input type="text" id="assetId" placeholder="Asset ID (e.g. MIC-01)" class="w-full p-2 border rounded text-sm">
                <input type="text" id="assetMakeModel" placeholder="Make & Model (e.g. Shure SM57)" class="w-full p-2 border rounded text-sm">
                <input type="text" id="assetCategory" placeholder="Category (e.g. Microphone)" class="w-full p-2 border rounded text-sm">
                <input type="text" id="assetLocation" placeholder="Location (e.g. Store Room)" class="w-full p-2 border rounded text-sm">
                <select id="assetCondition" class="w-full p-2 border rounded text-sm bg-white">
                    <option value="Working">Working</option>
                    <option value="Needs Repair">Needs Repair</option>
                    <option value="Out for Service">Out for Service</option>
                </select>
            </div>
            <div class="mt-6 flex justify-end space-x-2">
                <button onclick="closeAddAssetModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded text-sm">Cancel</button>
                <button onclick="saveNewAsset()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded text-sm">Save Asset</button>
            </div>
        </div>
    </div>

    <!-- App Logic -->
    <script>
        let assets = JSON.parse(localStorage.getItem('musictech_assets') || '[]');

        function renderTable() {
            const tbody = document.getElementById('assetTableBody');
            tbody.innerHTML = '';
            if (assets.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-400">No assets found. Add one or sync from GitHub!</td></tr>`;
                return;
            }
            assets.forEach((a, index) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-3 font-medium">${a.id}</td>
                        <td class="p-3">${a.makeModel}</td>
                        <td class="p-3">${a.category}</td>
                        <td class="p-3">${a.location}</td>
                        <td class="p-3"><span class="px-2 py-0.5 text-xs rounded bg-slate-100 border">${a.condition}</span></td>
                        <td class="p-3 text-right">
                            <button onclick="deleteAsset(${index})" class="text-red-500 hover:text-red-700 text-xs">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        function openSyncModal() {
            document.getElementById('ghUser').value = localStorage.getItem('gh_user') || '';
            document.getElementById('ghRepo').value = localStorage.getItem('gh_repo') || '';
            document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';
            document.getElementById('syncModal').classList.remove('hidden');
        }
        function closeSyncModal() { document.getElementById('syncModal').classList.add('hidden'); }

        function saveGitHubConfig() {
            localStorage.setItem('gh_user', document.getElementById('ghUser').value.trim());
            localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
            localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
            closeSyncModal();
            updateSyncBadge();
            triggerGitHubSync();
        }

        function updateSyncBadge() {
            const badge = document.getElementById('syncStatusBadge');
            if (localStorage.getItem('gh_token')) {
                badge.className = "text-xs px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
                badge.innerText = "Connected to GitHub Sync";
            } else {
                badge.className = "text-xs px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30";
                badge.innerText = "Local Mode";
            }
        }

        function openAddAssetModal() { document.getElementById('assetModal').classList.remove('hidden'); }
        function closeAddAssetModal() { document.getElementById('assetModal').classList.add('hidden'); }

        function saveNewAsset() {
            const id = document.getElementById('assetId').value.trim();
            if (!id) return alert('Please enter an Asset ID');
            assets.push({
                id,
                makeModel: document.getElementById('assetMakeModel').value,
                category: document.getElementById('assetCategory').value,
                location: document.getElementById('assetLocation').value,
                condition: document.getElementById('assetCondition').value
            });
            localStorage.setItem('musictech_assets', JSON.stringify(assets));
            closeAddAssetModal();
            renderTable();
        }

        function deleteAsset(index) {
            assets.splice(index, 1);
            localStorage.setItem('musictech_assets', JSON.stringify(assets));
            renderTable();
        }

        async function triggerGitHubSync() {
            const user = localStorage.getItem('gh_user');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');
            if (!user || !repo || !token) {
                alert('Please configure your GitHub credentials in Cloud Sync first.');
                openSyncModal();
                return;
            }

            const apiURL = `https://api.github.com/repos/${user}/${repo}/contents/data.json`;
            
            // 1. Pull latest data first
            try {
                const res = await fetch(apiURL, {
                    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' }
                });
                if (res.ok) {
                    const fileData = await res.json();
                    const decoded = JSON.parse(atob(fileData.content));
                    assets = decoded;
                    localStorage.setItem('musictech_assets', JSON.stringify(assets));
                    renderTable();
                    alert('Sync Successful: Pulled latest data from GitHub!');
                    return;
                }
            } catch (e) {
                console.log('No existing remote data.json found, pushing initial data...');
            }

            // 2. If no file exists or pull failed, push current data
            try {
                let sha = undefined;
                const checkRes = await fetch(apiURL, {
                    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' }
                });
                if (checkRes.ok) {
                    const existing = await checkRes.json();
                    sha = existing.sha;
                }

                const putRes = await fetch(apiURL, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: 'Sync update inventory data.json',
                        content: btoa(JSON.stringify(assets, null, 2)),
                        sha: sha
                    })
                });

                if (putRes.ok) {
                    alert('Sync Successful: Pushed data to GitHub!');
                } else {
                    const err = await putRes.json();
                    alert('Sync Error: ' + err.message);
                }
            } catch (err) {
                alert('Connection failed: ' + err.message);
            }
        }

        updateSyncBadge();
        renderTable();
    </script>
</body>
</html>
